<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kisscsvimport</title>
    <script type="module">
      import "../dist/index.js";
    </script>
    <style>
      body {
        font-size: 3em;
      }
    </style>
  </head>
  <body>
    <csv-import-dialog id="csvImportDialog"></csv-import-dialog>
    <button onclick="document.getElementById('csvImportDialog').setAttribute('open', 'true')">
      open
    </button>
    <script>
      document.getElementById("csvImportDialog").addEventListener("import", (event) => {
        console.log(event.detail);
        alert(JSON.stringify(event.detail, null, 2));
      });
    </script>
  </body>
</html>
